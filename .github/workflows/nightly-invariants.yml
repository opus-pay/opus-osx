name: Nightly invariants

on:
    schedule:
        - cron: "0 3 * * *"
    workflow_dispatch:

jobs:
    invariants:
        name: Random-seed invariant run
        runs-on: ubuntu-latest
        # 10,000 random actions take well over the two minutes a single test gets by default.
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: yarn
            - name: Install dependencies
              run: yarn install --frozen-lockfile
            - name: Run ≥ 10,000 random actions
              env:
                  INVARIANT_ACTIONS: "10000"
                  INVARIANT_SEED: ${{ github.run_id }}
              run: yarn workspace @opus/contracts test test/invariant/Invariants.test.ts
            - name: Log seed
              if: always()
              run: echo "INVARIANT_SEED=${{ github.run_id }}"
