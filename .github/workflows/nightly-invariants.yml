name: Nightly invariants

on:
    schedule:
        - cron: "0 3 * * *"
    workflow_dispatch:

jobs:
    invariants:
        name: Random-seed invariant run
        runs-on: ubuntu-latest
        # The check walks every job made so far, so the time grows with the square of the actions: 2,000 take about
        # 35 minutes on a runner (measured), 10,000 would not fit the job limit. The test sets its own timeout.
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: yarn
            - name: Install dependencies
              run: yarn install --frozen-lockfile
            - name: Run 2,000 random actions
              env:
                  INVARIANT_ACTIONS: "2000"
                  INVARIANT_SEED: ${{ github.run_id }}
              run: yarn workspace @opus/contracts test test/invariant/Invariants.test.ts
            - name: Log seed
              if: always()
              run: echo "INVARIANT_SEED=${{ github.run_id }}"
