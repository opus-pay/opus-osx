# Keeper, relayer and indexer daemons. Keys stay in config/keeper.env and config/relayer.env.
# Copy config/keeper.env.sample, config/relayer.env.sample and config/indexer.env.sample, then fill them in.
# Addresses and the sanctions list are mounted from config/, not from the image.
# Published images are mukeunkim/opus-keeper, mukeunkim/opus-relayer and mukeunkim/opus-indexer.
# Each image is its own Dockerfile target. Only the relayer and the indexer take requests; both are published on
# 127.0.0.1 only. Put a reverse proxy with TLS in front before exposing either to the internet.

services:
    keeper:
        image: mukeunkim/opus-keeper:latest
        build:
            context: .
            dockerfile: Dockerfile
            target: keeper
        env_file:
            - config/keeper.env
        volumes:
            - ./config/addresses.json:/config/addresses.json:ro
        ports:
            - "127.0.0.1:8789:8789"
        restart: unless-stopped
        init: true
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    relayer:
        image: mukeunkim/opus-relayer:latest
        build:
            context: .
            dockerfile: Dockerfile
            target: relayer
        env_file:
            - config/relayer.env
        volumes:
            - ./config/addresses.json:/config/addresses.json:ro
            - ./config/sanctions.txt:/config/sanctions.txt:ro
            - relayer-state:/state
        ports:
            - "127.0.0.1:8787:8787"
        restart: unless-stopped
        init: true
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    indexer:
        image: mukeunkim/opus-indexer:latest
        build:
            context: .
            dockerfile: Dockerfile
            target: indexer
        env_file:
            - config/indexer.env
        volumes:
            - ./config/addresses.json:/config/addresses.json:ro
            # The ledger (SQLite) survives restarts and image updates here. Not used when INDEXER_DATABASE_URL is set.
            - indexer-data:/data
        ports:
            - "127.0.0.1:8788:8788"
        restart: unless-stopped
        init: true
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

volumes:
    indexer-data:
    relayer-state:
